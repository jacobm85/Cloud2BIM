<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud2BIM — Segment Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f1117; color: #e2e4f0; font-family: system-ui, sans-serif;
           height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: #1a1d27; border-bottom: 1px solid #2e3350;
             display: flex; align-items: center; gap: 12px; font-size: 13px; flex-shrink: 0; }
    header strong { color: #4f8ef7; }
    header .pill { margin-left: auto; font-size: 11px; color: #7b82a0; padding: 2px 8px;
                   border: 1px solid #2e3350; border-radius: 999px; }
    #wrap { flex: 1; position: relative; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 12px;
               background: #0f1117; color: #7b82a0; font-size: 13px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #2e3350;
               border-top-color: #4f8ef7; border-radius: 50%;
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #legend { position: absolute; top: 12px; right: 12px; background: rgba(26,29,39,.88);
              border: 1px solid #2e3350; border-radius: 8px; padding: 10px 14px;
              font-size: 11px; display: flex; flex-direction: column; gap: 2px;
              backdrop-filter: blur(4px); max-height: 80vh; overflow-y: auto;
              min-width: 200px; }
    #legend h4 { font-size: 11px; color: #4f8ef7; margin: 8px 0 4px; font-weight: 600; }
    #legend h4:first-child { margin-top: 0; }
    .leg { display: flex; align-items: center; gap: 7px; cursor: pointer;
           padding: 4px 6px; margin: 0 -6px; border-radius: 4px; user-select: none;
           transition: background .12s, opacity .12s; }
    .leg:hover { background: rgba(255,255,255,0.05); }
    .leg.off { opacity: 0.35; }
    .leg.off .dot { background: #444 !important; }
    .leg .count { color: #7b82a0; font-size: 10px; margin-left: auto; padding-left: 12px; }
    .dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    #legend-actions { display: flex; gap: 6px; margin-top: 8px; padding-top: 6px;
                      border-top: 1px solid #2e3350; }
    #legend-actions button { background: transparent; border: 1px solid #2e3350;
        color: #7b82a0; font-size: 10px; padding: 3px 7px; border-radius: 4px;
        cursor: pointer; flex: 1; font-family: inherit; }
    #legend-actions button:hover { color: #e2e4f0; border-color: #4f8ef7; }
    #stats { position: absolute; bottom: 12px; left: 12px; font-size: 11px;
             color: #4f5580; }
    #close-hint { position: absolute; bottom: 12px; right: 12px; font-size: 11px;
                  color: #4f5580; }
  </style>
</head>
<body>

<header>
  <strong>Cloud2BIM</strong>
  <span id="hdr">3D Segmentvy — laddar…</span>
  <span class="pill">Stäng fliken för att återgå till wizarden</span>
</header>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay"><div class="spinner"></div><div id="status">Laddar…</div></div>
  <div id="legend" style="display:none">
    <h4>Behålls (mål-klasser)</h4>
    <div id="legend-keep"></div>
    <h4>Filtreras bort (möbler m.m.)</h4>
    <div id="legend-strip"></div>
    <div id="legend-actions">
      <button id="leg-all">Visa alla</button>
      <button id="leg-none">Dölj alla</button>
    </div>
  </div>
  <div id="stats"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params  = new URLSearchParams(location.search);
const jobId   = params.get('job');
const overlay = document.getElementById('overlay');
const status  = document.getElementById('status');
const wrap    = document.getElementById('wrap');

function setStatus(msg) { status.textContent = msg; }
function showError(msg) {
  overlay.innerHTML = `<div style="color:#e84855;text-align:center;padding:24px;max-width:480px">
    <div style="font-size:22px;margin-bottom:8px">⚠️</div><div>${msg}</div></div>`;
}
if (!jobId) { showError('Inget jobb-ID (?job=…)'); throw new Error(); }

// ── Class palette ─────────────────────────────────────────────────────────
// Distinct colours per class for both S3DIS (indoor) and SemanticKITTI
// (outdoor) vocabularies. "Keep" classes feed the downstream BIM
// extractors (walls / openings / columns); "strip" classes are clutter
// the geometric pipeline filters out. SemanticKITTI's defaults are a
// best-guess for BIM use — everything outdoor that isn't "building" or
// vertical structure is stripped, but every class still gets its own
// colour so the user can verify the segmenter actually separated them.
const CLASS_INFO = {
  // ── S3DIS (13 indoor classes) ────────────────────────────────────────
  ceiling:        { color: 0xd7d7df, group: 'keep'  },
  floor:          { color: 0x8c8c9e, group: 'keep'  },
  wall:           { color: 0x7fa8cc, group: 'keep'  },
  beam:           { color: 0xa48ee6, group: 'keep'  },
  column:         { color: 0xa48ee6, group: 'keep'  },
  window:         { color: 0x8dd3ff, group: 'keep'  },
  door:           { color: 0xc79e80, group: 'keep'  },
  table:          { color: 0x8b3a3a, group: 'strip' },
  chair:          { color: 0xa84d4d, group: 'strip' },
  sofa:           { color: 0xb86c4d, group: 'strip' },
  bookcase:       { color: 0x8a6d3b, group: 'strip' },
  board:          { color: 0x5e7a8a, group: 'strip' },
  clutter:        { color: 0x4a4a52, group: 'strip' },

  // ── SemanticKITTI (19 outdoor classes) ───────────────────────────────
  // Architectural — keep as primary BIM input.
  building:       { color: 0x7fa8cc, group: 'keep'  },
  fence:          { color: 0xa48ee6, group: 'keep'  },
  // Vertical structures — useful as columns / lamp posts.
  pole:           { color: 0xc1a35a, group: 'keep'  },
  trunk:          { color: 0x8a6d3b, group: 'keep'  },
  'traffic-sign': { color: 0xe0c060, group: 'strip' },
  // Ground surfaces — strip by default, but each gets its own colour.
  road:           { color: 0x4a4a52, group: 'strip' },
  parking:        { color: 0x5e5b58, group: 'strip' },
  sidewalk:       { color: 0x6b6873, group: 'strip' },
  'other-ground': { color: 0x55555e, group: 'strip' },
  terrain:        { color: 0x4e6b3a, group: 'strip' },
  // Nature.
  vegetation:     { color: 0x3e8a3e, group: 'strip' },
  // Vehicles.
  car:            { color: 0xc0392b, group: 'strip' },
  bicycle:        { color: 0xd64545, group: 'strip' },
  motorcycle:     { color: 0xe07b50, group: 'strip' },
  truck:          { color: 0x8b3a3a, group: 'strip' },
  'other-vehicle': { color: 0xa84d4d, group: 'strip' },
  // People.
  person:         { color: 0xffb6c1, group: 'strip' },
  bicyclist:      { color: 0xff9aa2, group: 'strip' },
  motorcyclist:   { color: 0xff7f7f, group: 'strip' },

  // Generic / fallback labels:
  unknown:        { color: 0x4f8ef7, group: 'keep'  },
};

// Pool of well-separated fallback colours used when the segmenter
// emits a class name we don't recognise. Cycled so each unknown class
// still gets a distinct colour rather than all of them sharing magenta.
const FALLBACK_COLORS = [
  0xff7f50, 0x6495ed, 0xdda0dd, 0x90ee90, 0xffa07a, 0x20b2aa,
  0xee82ee, 0xf0e68c, 0xadd8e6, 0xb0c4de, 0xda70d6, 0xff6347,
];
const _fallbackForName = new Map();
function infoFor(name) {
  if (CLASS_INFO[name]) return CLASS_INFO[name];
  // Stable colour per unrecognised name, so re-renders look the same.
  if (!_fallbackForName.has(name)) {
    const color = FALLBACK_COLORS[_fallbackForName.size % FALLBACK_COLORS.length];
    _fallbackForName.set(name, { color, group: 'strip' });
  }
  return _fallbackForName.get(name);
}

// ── Three.js setup ─────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1117);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(wrap);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
scene.add(new THREE.HemisphereLight(0x4466aa, 0x224422, 0.3));

// IFC convention: Z-up, but Three.js is Y-up — rotate the root group.
const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;
scene.add(root);

const grid = new THREE.GridHelper(200, 40, 0x2e3350, 0x1f2236);
scene.add(grid);

// ── Load labeled point cloud ──────────────────────────────────────────────
setStatus('Hämtar segmenterat punktmoln…');
let buf, labelNames;
try {
  const res = await fetch(`/api/jobs/${jobId}/segment_pointcloud.bin?max_points=200000`);
  if (!res.ok) {
    const txt = await res.text();
    showError('Kunde inte ladda segmenterat punktmoln (HTTP ' + res.status + '). ' + txt);
    throw new Error('HTTP ' + res.status);
  }
  buf = await res.arrayBuffer();
  // Class name order is delivered as a header so we can build the legend.
  labelNames = (res.headers.get('X-Label-Names') || '').split(',').filter(Boolean);
} catch(e) {
  showError(e.message || 'Okänt fel vid laddning av punktmoln.');
  throw e;
}

// Layout: 4 float32 per point — (x, y, z, label_id).
const arr = new Float32Array(buf);
if (arr.length === 0) { showError('Tomt punktmoln.'); throw new Error(); }
const nPoints = arr.length / 4;

setStatus('Bygger 3D-scen…');

// Split per class so the legend can toggle each on/off, and to give each
// class its own buffer/colour material.
const perClass = new Map();  // label_id (int) → Float32Array of XYZ
for (let i = 0; i < nPoints; i++) {
  const off = i * 4;
  const label = Math.round(arr[off + 3]);
  if (!perClass.has(label)) perClass.set(label, []);
  const a = perClass.get(label);
  a.push(arr[off], arr[off + 1], arr[off + 2]);
}

const pointsByLabel = new Map();   // label_id → THREE.Points
let totalPoints = 0;
for (const [label, vals] of perClass) {
  const name = labelNames[label] || `class_${label}`;
  const info = infoFor(name);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(vals, 3));
  const mat = new THREE.PointsMaterial({
    color: info.color, size: 0.05, sizeAttenuation: true,
  });
  const points = new THREE.Points(geom, mat);
  points.userData = { name, count: vals.length / 3, group: info.group };
  pointsByLabel.set(label, points);
  root.add(points);
  totalPoints += vals.length / 3;
}

// Fit camera to all points.
const bbox = new THREE.Box3().setFromObject(root);
if (!bbox.isEmpty()) {
  const center = bbox.getCenter(new THREE.Vector3());
  const size   = bbox.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist   = maxDim * 1.8;
  camera.position.set(center.x + dist * 0.6, center.y + dist * 0.5, center.z + dist);
  camera.near = Math.max(0.01, dist * 0.001);
  camera.far  = Math.max(500, dist * 50);
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

// ── Legend ────────────────────────────────────────────────────────────────
const keepWrap  = document.getElementById('legend-keep');
const stripWrap = document.getElementById('legend-strip');

function makeRow(label, points) {
  const row = document.createElement('div');
  row.className = 'leg';
  row.dataset.label = String(label);
  const hex = '#' + points.material.color.getHexString();
  row.innerHTML = `<div class="dot" style="background:${hex}"></div>` +
    `<span>${points.userData.name}</span>` +
    `<span class="count">${points.userData.count.toLocaleString()} pts</span>`;
  row.addEventListener('click', () => {
    row.classList.toggle('off');
    points.visible = !row.classList.contains('off');
  });
  return row;
}

// Sort so larger classes float to the top within each group — easier to scan.
const sorted = Array.from(pointsByLabel.entries())
  .sort((a, b) => b[1].userData.count - a[1].userData.count);
for (const [label, points] of sorted) {
  const row = makeRow(label, points);
  if (points.userData.group === 'keep') {
    keepWrap.appendChild(row);
  } else {
    stripWrap.appendChild(row);
  }
}

document.getElementById('leg-all').addEventListener('click', () => {
  for (const [, points] of pointsByLabel) points.visible = true;
  for (const row of document.querySelectorAll('#legend .leg')) row.classList.remove('off');
});
document.getElementById('leg-none').addEventListener('click', () => {
  for (const [, points] of pointsByLabel) points.visible = false;
  for (const row of document.querySelectorAll('#legend .leg')) row.classList.add('off');
});

document.getElementById('legend').style.display = 'flex';
document.getElementById('stats').textContent =
  `${nPoints.toLocaleString()} punkter · ${pointsByLabel.size} klasser`;
document.getElementById('hdr').textContent =
  `3D Segmentvy — ${nPoints.toLocaleString()} punkter`;
overlay.style.display = 'none';

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
